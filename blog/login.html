<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Admin Login | BrandMakingTractor</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="96x96" href="/assets/images/logo-icon-96.png">
<link rel="apple-touch-icon" href="/assets/images/logo-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://pxvlfsypycbfxabndfqm.supabase.co" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/css/style.css?v=20261007b">
<link rel="stylesheet" href="/assets/css/admin.css?v=20261007b">
<script src="/assets/js/config.js?v=20261007b"></script>
</head>
<body class="admin-body">

<div class="admin-login-shell">
  <div class="admin-login-card">
    <a href="/" class="logo-link logo-stack">
      <img src="/assets/images/logo.svg" alt="BrandMakingTractor - We Build Brands That Grow" class="logo-mark-lg">
    </a>
    <p class="text-muted text-center" style="margin-top:-14px;margin-bottom:18px;font-size:0.78rem;letter-spacing:0.1em;text-transform:uppercase;font-weight:600;">Admin Dashboard</p>

    <h1 style="font-size:1.3rem;text-align:center;margin-bottom:6px;">Admin Sign In</h1>
    <p class="text-muted text-center" style="margin-bottom:24px;">Blog &amp; lead management dashboard</p>

    <form id="adminLoginForm" novalidate>
      <div class="form-field">
        <label for="adminUsername">Username</label>
        <input type="text" id="adminUsername" autocomplete="username" placeholder="admin">
      </div>
      <div class="form-field">
        <label for="adminPassword">Password</label>
        <input type="password" id="adminPassword" autocomplete="current-password">
      </div>
      <button type="submit" id="adminLoginSubmit" class="btn btn-primary btn-block">Sign In</button>
      <div class="form-status" id="adminLoginStatus"></div>
    </form>
  </div>
</div>

<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script defer src="/assets/js/supabase-client.js?v=20261007b"></script>
<script defer src="/assets/js/forms.js?v=20261007b"></script>
<script defer src="/assets/js/notify.js?v=20261007b"></script>
<script defer src="/assets/js/admin/auth.js?v=20261007b"></script>
</body>
</html>
