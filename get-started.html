<div id="site-header"></div>

<main id="main">
  <section class="page-header">
    <div class="container text-center">
      <span class="eyebrow">Start A Project</span>
      <h1>Tell us a little about your project.</h1>
      <p style="max-width:520px;margin:0 auto;">Takes under a minute — we'll follow up to scope the details.</p>
    </div>
  </section>

  <section class="section">
    <div class="container" style="max-width:460px;">
      <div class="form-card">
        <div class="badge" style="margin-bottom:14px;">Quick Start</div>

        <form id="getStartedForm" novalidate>
          <div class="form-field">
            <label for="gsName">Full Name <span class="required">*</span></label>
            <input type="text" id="gsName" autocomplete="name">
            <span class="field-error"></span>
          </div>

          <div class="form-field">
            <label for="gsEmail">Email <span class="required">*</span></label>
            <input type="email" id="gsEmail" autocomplete="email">
            <span class="field-error"></span>
          </div>

          <div class="form-field">
            <label for="gsPhone">Phone <span class="required">*</span></label>
            <input type="tel" id="gsPhone" autocomplete="tel">
            <span class="field-error"></span>
          </div>

          <div class="form-field">
            <label for="gsService">Service Required <span class="required">*</span></label>
            <select id="gsService">
              <option value="">Select a service</option>
              <option value="Website Development">Website Development</option>
              <option value="Performance Marketing">Performance Marketing</option>
              <option value="Content Marketing">Content Marketing</option>
              <option value="SEO / AEO / GEO">SEO / AEO / GEO</option>
              <option value="Branding">Branding</option>
              <option value="Social Media Marketing">Social Media Marketing</option>
              <option value="Market Research">Market Research</option>
              <option value="UGC Video">UGC Video</option>
              <option value="Not Sure Yet">Not sure yet</option>
            </select>
            <span class="field-error"></span>
          </div>

          <div class="form-field">
            <label for="gsBudget">Budget Range (INR) <span class="required">*</span></label>
            <select id="gsBudget">
              <option value="">Select a budget range</option>
              <option value="Under ₹25,000">Under &#8377;25,000</option>
              <option value="₹25,000 - ₹1,00,000">&#8377;25,000 - &#8377;1,00,000</option>
              <option value="₹1,00,000 - ₹3,00,000">&#8377;1,00,000 - &#8377;3,00,000</option>
              <option value="₹3,00,000 - ₹10,00,000">&#8377;3,00,000 - &#8377;10,00,000</option>
              <option value="₹10,00,000+">&#8377;10,00,000+</option>
            </select>
            <span class="field-error"></span>
          </div>

          <button type="submit" id="getStartedSubmit" class="btn btn-primary btn-block">Submit Request</button>
          <div class="form-status" id="getStartedStatus"></div>
        </form>

        <div class="success-panel" id="getStartedSuccess" hidden>
          <div class="icon-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
          <h3>Request received</h3>
          <p>Thanks for the details — a member of our team will reach out shortly.</p>
          <a href="/" class="btn btn-secondary" style="margin-top:16px;">Back to Home</a>
        </div>
      </div>
    </div>
  </section>
</main>
